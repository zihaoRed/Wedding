# 对比页静态托管。
#
# 为什么需要它：飞书卡片渲染不了表格，而 .html 作为文件消息发到手机上
# 下载了也打不开。所以对比页走这里托管，卡片里放一个跳转按钮。
#
# ⚠️ 刻意用 8080，不碰 80。
#
# 这台 ECS 上已经跑着别的 nginx 站点。往 80 上加 server 块有两个坑，
# 而且方向相反、不容易预判：
#   · 若已有的块是 default_server，我这个块永远接不到请求，
#     表现是「配置装好了、按钮点开 404」；
#   · 若两个块都没标 default_server，nginx 用「配置文件名排序的第一个」
#     来接 Host 匹配不上的请求 —— 我的文件如果排在前面，就会把已有站点
#     从裸 IP / 未知域名访问下抢走，表现是「别人的站突然 404」。
# 换到 8080 之后，这个端口上没有别的 server 块，不存在归属歧义，
# 对 80 上的现有服务零影响。回滚也简单：删掉这个文件、reload 即可。
#
# 安装（Ubuntu/Debian）：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/wedding
#   sudo ln -s /etc/nginx/sites-available/wedding /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 安装（RHEL / Alibaba Cloud Linux）：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/wedding-web.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 不要删 /etc/nginx/sites-enabled/default，那是别人的站点。
#
# 装完记得在阿里云安全组放行 8080，并设：
#   PUBLIC_BASE_URL=http://<公网地址>:8080

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /srv/wedding/web;
    index index.html;

    # 对比页是给人看的临时产物，不要被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri =404;
    }

    # 只服务 .html，别把别的东西漏出去。
    # 对比页文件名是中文，nginx 会先把百分号编码解码再匹配，
    # 所以这里按解码后的 $uri 判断，中文名照常命中。
    location ~* ^/(?!.*\.html$).*$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # 想加 HTTPS 就用 certbot：
    #   sudo certbot --nginx -d your.domain.com
    # 加完把 .env 里的 PUBLIC_BASE_URL 改成 https://
}
