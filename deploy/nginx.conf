# 对比页静态托管。
#
# 为什么需要它：飞书卡片渲染不了表格，而 .html 作为文件消息发到手机上
# 下载了也打不开。所以对比页走这里托管，卡片里放一个跳转按钮。
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/wedding
#   sudo ln -s /etc/nginx/sites-available/wedding /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 然后 .env 里设 PUBLIC_BASE_URL=http://<你的域名或IP>

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/wedding/web;
    index index.html;

    # 对比页是给人看的临时产物，不要被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri =404;
    }

    # 只服务 .html，别把别的东西漏出去
    location ~* ^/(?!.*\.html$).*$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # 想加 HTTPS 就用 certbot：
    #   sudo certbot --nginx -d your.domain.com
    # 加完把 .env 里的 PUBLIC_BASE_URL 改成 https://
}
